<ng-container *ngIf="store">
  <div class="container my-5">
    <div class="row mb-4">
      <div class="col-7">
        <!-- Image -->
        <div class="card" style="max-width: 100%">
          <img
            src="{{ store.storeImage }}"
            class="card-img-top"
            alt="Store Image"
          />
        </div>
      </div>
      <div class="col-5">
        <!-- Store info -->
        <div>
          <h2 class="mb-1">{{ store.storeName }}</h2>
          <p class="text-muted mb-2">
            <strong>Address:</strong> Somewhere in the world
          </p>
          <p class="text-muted mb-2"><strong>Hours:</strong> 11:00 - 23:00</p>
        </div>
        <div *ngIf="!addingOrder" class="mt-4">
          <button class="btn btn-primary" (click)="startOrder()">
            Start an Order
          </button>
        </div>
        <div *ngIf="addingOrder" class="mt-4">
          <div class="container">
            <form (ngSubmit)="createOrder()" class="row g-3">
              <div class="col-md-6">
                <label for="orderDeadline" class="form-label my-1">Order Deadline:</label>
                <input
                  type="datetime-local"
                  [(ngModel)]="newOrder.orderDeadline"
                  name="orderDeadline"
                  class="form-control"
                  required
                />
                <label for="deliverTime" class="form-label my-1">Deliver Time:</label>
                <input
                  type="datetime-local"
                  [(ngModel)]="newOrder.deliverTime"
                  name="deliverTime"
                  class="form-control"
                  required
                />
              </div>
          
              <div class="col-12">
                <button type="submit" class="btn btn-primary">Submit</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
